name: fetch-api
run-name: Deploy fetch-api

on:
  workflow_dispatch:
  push:
    paths:
    - '.github/workflows/fetch-api.yaml'
    - 'fetch_api/**'
    - 'connectors/**'
    - 'common/**'
    - 'common-go/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: "ghcr.io"
  APP_REPO: "dragon699/home-k8s"
  ARGOCD_BIN_URL: "https://${{ secrets.ARGOCD_SERVER }}/download/argocd-linux-amd64"



jobs:

  Inspect:
    runs-on: gha-runner-fetch-api
    outputs:
      items: ${{ steps.items_to_build.outputs.items }}
    
    steps:
    - name: Fetch code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Prepare build candidates
      id: items_to_build
      run: |
        set -euo pipefail

        BASE_SHA="${{ github.event.before }}"
        ITEMS=(
          "fetch-api            | fetch_api             | common    | dragon699/fetch-api/fetch-api"
          "connector-downloader | connectors/downloader | common-go | dragon699/fetch-api/connectors/downloader"
          "connector-grafana    | connectors/grafana    | common    | dragon699/fetch-api/connectors/grafana"
          "connector-ml         | connectors/ml         | common    | dragon699/fetch-api/connectors/ml"
          "connector-slack      | connectors/slack      | common-go | dragon699/fetch-api/connectors/slack"
        )
        ITEMS_TO_BUILD=()

        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          if git rev-parse --verify "${{ github.sha }}^" >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse --verify "${{ github.sha }}^")"
          else
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        for ITEM in "${ITEMS[@]}"; do
          IFS='|' read -r RAW_NAME RAW_PATH RAW_DEPS RAW_IMAGE_NAME <<< "$ITEM"
          NAME="$(trim "$RAW_NAME")"
          ITEM_PATH="$(trim "$RAW_PATH")"
          DEPS="$(trim "$RAW_DEPS")"
          IMAGE_NAME="$(trim "$RAW_IMAGE_NAME")"

          if grep -qE "^${ITEM_PATH}/|^${DEPS}/" <<< "$CHANGED_FILES"; then
            VERSION="$(cat "${ITEM_PATH}/VERSION")"
            ITEMS_TO_BUILD+=("{\"name\":\"${NAME}\",\"path\":\"${ITEM_PATH}\",\"image_name\":\"${IMAGE_NAME}\",\"version\":\"${VERSION}\"}")
          fi
        done

        printf 'items={"include":[%s]}\n' "$(IFS=,; echo "${ITEMS_TO_BUILD[*]}")" >> "$GITHUB_OUTPUT"

  Deploy:
    name: Deploy ${{ matrix.name || ' ' }}
    needs: Inspect
    runs-on: gha-runner-fetch-api
    if: ${{ needs.Inspect.outputs.items != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.Inspect.outputs.items) }}
      fail-fast: false
    env:
      APP_DEPLOYMENT_FILE: "manifests/apps/fetch-api/${{ matrix.path }}/${{ matrix.name }}.yaml"
    timeout-minutes: 5

    steps:
    - name: Fetch code
      uses: actions/checkout@v6

    - name: Prepare registry auth
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.path }}/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.version }}
          ${{ env.REGISTRY }}/${{ matrix.image_name }}:latest

    - name: Fetch devops code
      uses: actions/checkout@v6
      with:
        repository: ${{ env.APP_REPO }}
        token: ${{ secrets.APP_REPO_TOKEN }}
        path: devops
        fetch-depth: 0
        ref: main

    - name: Fetch latest changes
      working-directory: devops
      run: |
        git config user.name "ActionsBot"
        git fetch origin main
        git pull --rebase origin main

    - name: Bump version
      uses: mikefarah/yq@master
      env:
        APP_DEPLOYMENT_FILE_PATH: "devops/${{ env.APP_DEPLOYMENT_FILE }}"
      with:
        cmd: yq -i '.spec.template.spec.containers[0].image = "${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ matrix.version }}"' ${{ env.APP_DEPLOYMENT_FILE_PATH }}

    - name: Sync changes
      id: deployment_changes
      working-directory: devops
      env:
        COMMIT_MESSAGE: >-
          ${{
            matrix.name == 'fetch-api' &&
            format('fetch-api: Bump to v{0}', matrix.version) ||
            format('fetch-api/{0}: Bump to v{1}', matrix.name, matrix.version)
          }}
      run: |
        set -euo pipefail

        git config user.name "ActionsBot"
        git config user.email "60757051+dragon699@users.noreply.github.com"

        git add "${{ env.APP_DEPLOYMENT_FILE }}"

        if git diff --cached --quiet; then
          echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"

        for attempt in 1 2 3; do
          if git push --force-with-lease origin HEAD:main; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$attempt" -eq 3 ]]; then
            exit 1
          fi

          git fetch origin main
          git pull --rebase origin main
        done

    - name: Deploy
      uses: clowdhaus/argo-cd-action/@main
      if: steps.deployment_changes.outputs.changes_detected == 'true'
      with:
        download-url: ${{ env.ARGOCD_BIN_URL }}
        command: app sync fetch-api
        options: >-
          --auth-token ${{ secrets.ARGOCD_TOKEN }}
          --server ${{ secrets.ARGOCD_SERVER }}
          --grpc-web
          --retry-limit 15
          --retry-backoff-duration 10s
          --retry-backoff-max-duration 10s
          --retry-backoff-factor 1
