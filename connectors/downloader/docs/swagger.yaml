basePath: /
definitions:
  request.AddTorrentPayload:
    properties:
      category:
        type: string
      find_subs:
        type: boolean
      manage:
        type: boolean
      notify:
        type: boolean
      save_path:
        type: string
      tags:
        items:
          type: string
        type: array
      url:
        type: string
    type: object
  request.AddTorrentTagsPayload:
    properties:
      hash:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  request.DeleteTorrentTagsPayload:
    properties:
      hash:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
      upstream_response:
        additionalProperties: {}
        type: object
    type: object
  response.HealthResponse:
    properties:
      connector_name:
        type: string
      health_last_check:
        type: string
      health_next_check:
        type: string
      healthy:
        type: boolean
    type: object
  response.ReadyResponse:
    properties:
      ready:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  response.Torrent:
    properties:
      category:
        type: string
      date_added:
        type: string
      date_completed:
        type: string
      date_last_activity:
        type: string
      eta_minutes:
        type: integer
      files_availability_percentage:
        type: number
      files_count:
        type: integer
      files_path:
        type: string
      hash:
        type: string
      id:
        type: integer
      imdb:
        type: string
      leechers:
        type: integer
      magnet_uri:
        type: string
      meta:
        $ref: '#/definitions/response.TorrentMeta'
      name:
        type: string
      progress_percentage:
        type: number
      save_path:
        type: string
      seeders:
        type: integer
      size_downloaded_mb:
        type: integer
      size_left_mb:
        type: integer
      size_mb:
        type: integer
      size_total_gb:
        type: number
      size_total_mb:
        type: integer
      size_uploaded_mb:
        type: integer
      speed_download_mbps:
        type: number
      speed_upload_mbps:
        type: number
      status:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  response.TorrentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.Torrent'
        type: array
      total_items:
        type: integer
    type: object
  response.TorrentMeta:
    properties:
      managed_by:
        type: string
      scheduled_actions:
        items:
          $ref: '#/definitions/response.TorrentMetaScheduledAction'
        type: array
    type: object
  response.TorrentMetaScheduledAction:
    properties:
      category:
        type: string
      description:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: A connector that downloads data from various sources to the host.
  title: Downloader Connector
paths:
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.HealthResponse'
      summary: Health check
      tags:
      - health
  /api/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ReadyResponse'
      summary: Readiness check
      tags:
      - health
  /mcp:
    post:
      consumes:
      - application/json
      description: |-
        Model Context Protocol endpoint exposing the search_torrents, download, list_downloads and get_download tools.
        Stateless JSON-RPC over POST with plain JSON responses. Only registered when MCP_AUTH_TOKEN is set.
      parameters:
      - description: Bearer <MCP_AUTH_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: JSON-RPC 2.0 request, e.g. initialize, tools/list or tools/call
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: JSON-RPC 2.0 response
          schema:
            type: object
        "401":
          description: Missing or invalid bearer token
      summary: MCP server (Streamable HTTP)
      tags:
      - mcp
  /torrents:
    get:
      description: Returns list of torrents in qBittorrent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TorrentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List torrents in qBittorrent
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a torrent to qBittorrent using a torrent or magnet url.
      parameters:
      - description: Torrent payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AddTorrentPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Add a torrent to qBittorrent
      tags:
      - torrents
  /torrents/search:
    get:
      consumes:
      - application/json
      description: Searches for torrents in torrent providers.
      parameters:
      - in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TorrentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Search for torrents in torrent providers
      tags:
      - torrents
  /torrents/tags:
    delete:
      consumes:
      - application/json
      description: Deletes a tag from a torrent in qBittorrent.
      parameters:
      - description: Delete torrent tags payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.DeleteTorrentTagsPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete a tag from a torrent in qBittorrent
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a tag to a torrent in qBittorrent.
      parameters:
      - description: Add torrent tags payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AddTorrentTagsPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Add a tag to a torrent in qBittorrent
      tags:
      - torrents
produces:
- application/json
swagger: "2.0"
